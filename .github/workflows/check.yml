name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2, wp-cli
      - run: composer install --no-interaction --prefer-dist
      - run: composer compat
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run make-pot
      - run: npm run package:wp
      - run: npm run verify:package
      - name: Stage runtime for Plugin Check
        run: unzip -q cf7-styler-for-divi-*.zip -d release
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: release/cf7-styler-for-divi
