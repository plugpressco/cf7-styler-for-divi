name: Publish complete source to public repository
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Configure public repository access
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/cf7mate_public_key
          chmod 600 ~/.ssh/cf7mate_public_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Publish source snapshot without private repository history
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/cf7mate_public_key -o IdentitiesOnly=yes
        run: |
          git clone git@github.com:plugpressco/cf7-styler-for-divi.git /tmp/cf7mate-public
          rsync -a --delete --exclude='.git/' --exclude='.claude/' --exclude='.agents/' --exclude='.codex/' --exclude='.aws/' --exclude='.env*' --exclude='node_modules/' --exclude='vendor/' --exclude='output/' --exclude='release/' --exclude='package/' --exclude='update-server/' --exclude='/AGENTS.md' --exclude='/docs/' --exclude='*.zip' ./ /tmp/cf7mate-public/
          cd /tmp/cf7mate-public
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish unified free CF7 Mate source'
            git push origin HEAD:main
          fi
